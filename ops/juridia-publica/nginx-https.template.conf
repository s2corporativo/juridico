# Template para ativação SOMENTE após DNS + emissão do certificado.
# Requer o serviço Juridiá já testado no loopback 127.0.0.1:3005.
# NÃO publicar a porta 3005. NÃO instalar este arquivo antes dos pré-requisitos.
server {
  listen 80;
  listen [::]:80;
  server_name juridia.depaulateixeira.adv.br;
  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }
  location / {
    return 301 https://juridia.depaulateixeira.adv.br$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name juridia.depaulateixeira.adv.br;
  ssl_certificate /etc/letsencrypt/live/juridia.depaulateixeira.adv.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/juridia.depaulateixeira.adv.br/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  client_max_body_size 16m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location / {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_redirect off;
  }
}
