# Ajuste server_name e caminhos do certificado antes de habilitar.
server {
    listen 80;
    listen [::]:80;
    server_name ejc.depaulateixeira.adv.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ejc.depaulateixeira.adv.br;

    ssl_certificate /etc/letsencrypt/live/ejc.depaulateixeira.adv.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ejc.depaulateixeira.adv.br/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3010/healthz;
        proxy_set_header Host $host;
        access_log off;
    }
}
