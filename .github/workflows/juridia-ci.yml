name: JuridIA CI

on:
  pull_request:
    paths:
      - "apps/juridia/**"
      - ".github/workflows/juridia-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/juridia
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Prisma generate
        run: bun run db:generate
      - name: TypeScript
        run: bun x tsc --noEmit
      - name: Core tests
        run: bun test tests/gates.test.ts tests/auth-oidc.test.ts tests/minuta-pipeline.test.ts tests/paginate.test.ts tests/ejc-brain-core.test.ts tests/embedding-retrieval.test.ts tests/office-skill-catalog.test.ts tests/document-security.test.ts tests/atlas-knowledge-bridge.test.ts
      - name: Build
        env:
          DATABASE_URL: file:./ci.db
          NODE_ENV: production
          JURIDIA_SESSION_SECRET: ci-only-not-production-secret-0123456789
          JWT_SECRET: ci-only-not-production-secret-0123456789
          EJC_OIDC_CLIENT_SECRET: ci-only-not-production-secret
          EJC_OIDC_ISSUER: https://example.invalid
        run: bun run build
