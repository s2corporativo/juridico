# Jurimetria DPT — CI (GitHub Actions)
# Lint + verificação de tipos em cada push/PR. Roda a partir do primeiro push
# para github.com/s2corporativo/juridico (aguardando PAT do usuário).
# Passos de build/teste integrado (RAG suite) serão adicionados após o push inicial.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit
