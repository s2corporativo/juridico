name: Atlas CI

on:
  pull_request:
    branches: [atlas-forense]
  push:
    branches: [atlas-forense]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Verify the legacy schema is preserved without a new migration
        env:
          DATABASE_URL: mysql://atlas_dummy:atlas_dummy@127.0.0.1:3306/atlas_dummy
        run: |
          pnpm exec drizzle-kit generate
          test -z "$(git status --porcelain -- drizzle)"
